<h2 mat-dialog-title>{{data.title|transloco}}</h2>
<mat-dialog-content>{{data.text|transloco}}</mat-dialog-content>
<mat-dialog-actions>
  <button matButton [mat-dialog-close]="false">{{'No'|transloco}}</button>
  <button matButton [mat-dialog-close]="true" cdkFocusInitial>{{'Yes'|transloco}}</button>
</mat-dialog-actions>
