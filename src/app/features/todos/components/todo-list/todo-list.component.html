<div>
  <mat-form-field>
    <mat-label>{{ 'Theme' | transloco }}</mat-label>
    <mat-select (selectionChange)="onSelectionChange($event)" [value]="currentPalette()">
      @for (palette of palettes; track palette) {
        <mat-option [value]="palette.value">{{ palette.key | transloco}}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
